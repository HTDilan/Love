<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do you love me? ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Pantalla 1: Tarjeta */
        .card {
            border: 3px solid #fff;
            padding: 40px 30px;
            text-align: center;
            background-color: #000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 10;
            min-width: 320px;
        }

        .card h1 {
            font-size: 26px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 50px;
        }

        button {
            padding: 10px 25px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #fff;
            background: #fff;
            color: #000;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        #noBtn {
            position: absolute;
            background: #000;
            color: #fff;
            left: 170px;
        }

        /* Pantalla 2: Animación */
        .love-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Elemento central: Corazón e iluminación */
        .heart-container {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: pulse 1.1s infinite alternate ease-in-out;
        }

        .heart {
            background-color: #ff007f;
            display: inline-block;
            height: 90px;
            margin: 20px 10px;
            position: relative;
            transform: rotate(-45deg);
            width: 90px;
            box-shadow: 0 0 50px #ff007f, 0 0 100px #ff007f, 0 0 150px #ff007f;
        }

        .heart:before,
        .heart:after {
            content: "";
            background-color: #ff007f;
            border-radius: 50%;
            height: 90px;
            position: absolute;
            width: 90px;
            box-shadow: 0 0 50px #ff007f;
        }

        .heart:before {
            top: -45px;
            left: 0;
        }

        .heart:after {
            left: 45px;
            top: 0;
        }

        .love-title {
            color: #fff;
            font-size: 46px;
            font-weight: 900;
            margin-bottom: 25px;
            text-shadow: 0 0 20px #ff007f, 0 0 40px #ff007f, 0 0 60px #ff007f;
            letter-spacing: 5px;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); }
            100% { transform: scale(1.12); }
        }
    </style>
</head>
<body>

    <div class="card" id="card">
        <h1>Do you love me?</h1>
        <div class="btn-container">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <div class="love-screen" id="loveScreen">
        <canvas id="matrixCanvas"></canvas>
        <div class="heart-container">
            <div class="love-title">LOVE YOU</div>
            <div class="heart"></div>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const card = document.getElementById('card');
        const loveScreen = document.getElementById('loveScreen');
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function moveNoButton() {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40);
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        let columns = [];
        const fontSize = 15;
        const text = "LOVE YOU ";

        function initMatrix() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
            const textWidth = ctx.measureText(text).width;
            
            const columnCount = Math.ceil(canvas.width / textWidth);
            columns = [];

            for (let i = 0; i < columnCount; i++) {
                columns.push({
                    x: i * textWidth,
                    y: Math.random() * canvas.height,
                    direction: i % 2 === 0 ? 1 : -1,
                    speed: 1.8
                });
            }
        }

        function drawMatrix() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Tono magenta brillante idéntico al fondo del video
            ctx.fillStyle = '#880044'; 
            ctx.font = `bold ${fontSize}px 'Courier New', monospace`;

            const textHeight = fontSize * 1.3;
            const rowsNeeded = Math.ceil(canvas.height / textHeight) + 4;

            columns.forEach(col => {
                col.y += col.direction * col.speed;

                if (col.direction === 1 && col.y > textHeight) {
                    col.y -= textHeight;
                } else if (col.direction === -1 && col.y < -textHeight) {
                    col.y += textHeight;
                }

                for (let r = -2; r < rowsNeeded; r++) {
                    ctx.fillText(text, col.x, col.y + (r * textHeight));
                }
            });

            requestAnimationFrame(drawMatrix);
        }

        yesBtn.addEventListener('click', () => {
            card.style.display = 'none';
            loveScreen.style.display = 'flex';
            initMatrix();
            drawMatrix();
        });

        window.addEventListener('resize', initMatrix);
    </script>
</body>
</html>
